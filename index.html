<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hoity Toity Codebin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="hoity-toity.js"></script>
    <script src="codebin/output-preview.js"></script>
    <script type="importmap">
      {
        "imports": {
          "codebin": "./codebin/Codebin.js",
          "microplugins": "./codebin/Microplugins.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col" style="min-height: 30vh">
          <output-preview id="preview" html="<h1>Hello World</h1>"></output-preview>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <p >
            <button class="btn btn-outline-secondary btn-sm active" type="button" data-function="columnToggler" data-target="collapseJs">JS</button>
            <button class="btn btn-outline-secondary btn-sm active" type="button" data-function="columnToggler" data-target="collapseCss">CSS</button>
            <button class="btn btn-outline-secondary btn-sm active" type="button" data-function="columnToggler" data-target="collapseHtml">HTML</button>
          </p>
        </div>
      </div>
      <div class="row">
          <div id="collapseJs" class="col col-shown" style="">
            <hoity-toity id="js" language="javascript"></hoity-toity>
          </div>
          <div id="collapseCss" class="col col-shown" style="">
            <hoity-toity id="css" language="css"></hoity-toity>
          </div>
          <div id="collapseHtml" class="col col-shown" style="">
            <hoity-toity id="html" language="html"></hoity-toity>
          </div>
      </div>
    </div>



<script type="text/plain" id="javascriptData">
// Your JavaScript here (hit F12 to open up the standard console)
function greet(name) {
  const msg = `Hello, ${name}!`;
  console.log(msg);
  document.querySelector('h1').innerText = msg;
}
greet('World');
</script>

<script type="text/plain" id="cssData">
/* Your CSS here */
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 20px;
}

h1, small {
  color: orangered;
}
</script>

<script type="text/plain" id="htmlData">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JavaScripts writes here!</h1>
    <h2>Hello Cats!</h2>
    <small>this is a live preview of the code below</small>
</body>
</html>
</script>







    <script type="module">
      import { Microplugins } from "microplugins";
      import { Codebin } from "codebin";

      const javascriptData = document.getElementById("javascriptData");
      const cssData = document.getElementById("cssData");
      const htmlData = document.getElementById("htmlData");

      const js = document.getElementById("js");
      const css = document.getElementById("css");
      const html = document.getElementById("html");

      js.setValue(javascriptData.textContent);
      css.setValue(cssData.textContent);
      html.setValue(htmlData.innerHTML);

      const codebin = new Codebin({
        js,
        css,
        html,
        preview: document.getElementById("preview"),
      });

      const microplugins = new Microplugins(); // call microplugins.terminate() when done

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  </body>
</html>
